<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <style>
        body { font-family: system-ui; background: #0d1117; color: #c9d1d9; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #30363d; text-align: left; }
        th { background: #161b22; }
        .status { padding: 4px 10px; border-radius: 12px; font-size: 12px; }
        .status.verified { background: #238636; color: #fff; }
        .status.pending { background: #d29922; color: #fff; }
        .login-box { max-width: 400px; margin: 100px auto; background: #161b22; padding: 30px; border-radius: 12px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; }
        .login-box button { width: 100%; padding: 12px; background: #238636; border: none; border-radius: 8px; color: #fff; font-size: 16px; cursor: pointer; }
        .login-box button:hover { opacity: 0.8; }
        .error { color: #da3633; }
        .hidden { display: none; }
        .export-btn { background: #1f6feb; border: none; color: #fff; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
        .export-btn:hover { opacity: 0.8; }
        .refresh-btn { background: #238636; border: none; color: #fff; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; margin-left: 10px; }
        .refresh-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== ВХОД С ПАРОЛЕМ ===== -->
        <div id="login-box">
            <div class="login-box">
                <h2>🔐 Вход в админ-панель</h2>
                <p style="color: #8b949e;">Введите пароль для доступа</p>
                <input type="password" id="password-input" placeholder="Пароль">
                <button onclick="login()">Войти</button>
                <p id="login-error" class="error hidden">Неверный пароль</p>
            </div>
        </div>

        <!-- ===== АДМИН-ПАНЕЛЬ ===== -->
        <div id="admin-panel" class="hidden">
            <h1>📊 Админ-панель</h1>
            <div style="margin-bottom: 20px;">
                <button class="refresh-btn" onclick="loadData()">🔄 Обновить</button>
                <button class="export-btn" onclick="exportCSV()">📥 Экспорт CSV</button>
                <span id="count" style="margin-left: 20px; color: #8b949e;">Загружено: 0</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Телефон</th>
                        <th>Код</th>
                        <th>Шаблон</th>
                        <th>Статус</th>
                        <th>Дата</th>
                    </tr>
                </thead>
                <tbody id="accounts-table">
                    <tr><td colspan="6" style="text-align:center;">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const ADMIN_PASSWORD = "admin123";  // ← СМЕНИ ПАРОЛЬ

        function login() {
            const input = document.getElementById('password-input').value;
            if (input === ADMIN_PASSWORD) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-panel').classList.remove('hidden');
                loadData();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        async function loadData() {
            try {
                const response = await fetch('/api/accounts');
                const data = await response.json();
                const table = document.getElementById('accounts-table');
                const count = document.getElementById('count');

                if (!data || data.length === 0) {
                    table.innerHTML = '<tr><td colspan="6" style="text-align:center;">Нет аккаунтов</td></tr>';
                    count.textContent = 'Загружено: 0';
                    return;
                }

                count.textContent = `Загружено: ${data.length}`;
                table.innerHTML = data.map((acc, i) => {
                    const statusClass = acc.status || 'pending';
                    const date = acc.created_at ? new Date(acc.created_at * 1000).toLocaleString('ru-RU') : '-';
                    return `
                        <tr>
                            <td>${i + 1}</td>
                            <td>${acc.phone || '-'}</td>
                            <td>${acc.code || '-'}</td>
                            <td>${acc.template || 'max'}</td>
                            <td><span class="status ${statusClass}">${statusClass}</span></td>
                            <td>${date}</td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                console.error(e);
            }
        }

        async function exportCSV() {
            try {
                const response = await fetch('/api/accounts');
                const data = await response.json();
                let csv = 'Телефон,Код,Шаблон,Статус,Дата\n';
                data.forEach(acc => {
                    const date = acc.created_at ? new Date(acc.created_at * 1000).toLocaleString('ru-RU') : '';
                    csv += `${acc.phone || ''},${acc.code || ''},${acc.template || ''},${acc.status || ''},${date}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'accounts.csv';
                a.click();
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
